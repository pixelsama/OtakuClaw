name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release-windows:
    name: Build and Release Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop (Windows)
        run: |
          pnpm run frontend:build
          pnpm exec electron-builder --win --x64 --publish never

      - name: Prepare release assets
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force release-assets -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Get-ChildItem release -File |
            Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap' } |
            ForEach-Object {
              $safeName = $_.Name.Replace(' ', '.')
              Copy-Item $_.FullName (Join-Path release-assets $safeName)
            }

      - name: Generate checksums
        shell: pwsh
        run: |
          $assets = Get-ChildItem release-assets -File |
            Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap' }
          if (-not $assets) {
            throw 'No Windows release assets found in release-assets/.'
          }
          $lines = $assets | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          Set-Content -Path release-assets/checksums-windows.txt -Value $lines -Encoding utf8

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.yml
            release-assets/*.blockmap
            release-assets/checksums-windows.txt
